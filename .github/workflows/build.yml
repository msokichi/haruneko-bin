name: Build package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and validate in Arch Linux
        run: |
          mkdir -p "$RUNNER_TEMP/haruneko-output"
          # Chromium needs nested user namespaces for its own sandbox.
          docker run --rm --security-opt seccomp=unconfined --security-opt no-new-privileges \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/haruneko-output:/out" \
            docker.io/library/archlinux@sha256:a1d4b509c51fc68dcc7ee1f88342fe26b1f65e6775c3aff26f196141e6c76a6f \
            bash /workspace/.github/scripts/build-package.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: haruneko-bin-x86_64
          path: ${{ runner.temp }}/haruneko-output/*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
